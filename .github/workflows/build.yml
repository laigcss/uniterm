name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      preview:
        description: 'Create a snapshot release (fixed tag, prerelease, rolling)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64,windows/arm64
            slug: windows
            artifact: uniTerm.exe
          - os: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
            artifact: uniTerm
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
            artifact: uniTerm
          - os: macos-latest
            platform: darwin/universal
            slug: darwin-universal
            artifact: uniTerm.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (macOS)
        if: matrix.platform == 'darwin/universal'
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_*.app 2>/dev/null || true
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          choco install nsis -y
          NSIS_BIN="/c/Program Files (x86)/NSIS/Bin"
          export PATH="$NSIS_BIN:$PATH"
          if [ ! -f "$NSIS_BIN/makensis.exe" ]; then echo "ERROR: makensis.exe not found at $NSIS_BIN"; exit 1; fi
          echo "makensis: $NSIS_BIN/makensis.exe"

          UPX_VER="5.2.0"
          curl -sSfL -o /tmp/upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-win64.zip"
          sha256sum /tmp/upx.zip
          unzip -o /tmp/upx.zip -d /tmp/upx > /dev/null
          mv -f /tmp/upx/upx-*/upx.exe "$NSIS_BIN/upx.exe"
          upx --version

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev upx

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "VERSION=dev-${SHORT}" >> $GITHUB_ENV
          fi

      - name: Install and build frontend
        env:
          VITE_VERSION: ${{ env.VERSION }}
        run: cd frontend && npm install && npm run build

      - name: Build
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"

          if [[ "$PLATFORM" == windows/* ]]; then
            export PATH="/c/Program Files (x86)/NSIS/Bin:$PATH"
          fi
          echo "PATH=$PATH"

          BUILD_ARGS="-platform $PLATFORM -ldflags \"-s -w -X main.Version=${{ env.VERSION }}\" -skipbindings"

          if [[ "$PLATFORM" == windows/* ]]; then
            BUILD_ARGS="$BUILD_ARGS"
          fi

          if [ "${PLATFORM%/*}" = "linux" ]; then
            BUILD_ARGS="$BUILD_ARGS -upx -upxflags=\"--best --lzma\""
          fi

          if [ "${PLATFORM%/*}" = "linux" ]; then
            BUILD_ARGS="$BUILD_ARGS -tags webkit2_41"
          fi

          echo "BUILD_ARGS=$BUILD_ARGS"
          eval wails build $BUILD_ARGS

      - name: Package (macOS)
        if: matrix.platform == 'darwin/universal'
        run: |
          chmod +x build/bin/uniTerm.app/Contents/MacOS/uniTerm
          codesign --force --deep --sign - build/bin/uniTerm.app

          cd build/bin
          mkdir -p dmg_staging
          cp -R uniTerm.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname uniTerm -srcfolder dmg_staging -ov -format UDZO ../../uniterm-darwin-universal-${VERSION}.dmg
          rm -rf dmg_staging

      - name: Download VcXsrv (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          VCXSRV_VERSION: v1.0.0
        run: |
          VCXSRV_DIR="build/windows/installer/plugins/vcxsrv"
          mkdir -p "$VCXSRV_DIR"
          curl -sSfL -o /tmp/vcxsrv.zip \
            "https://github.com/ys-ll/uniterm-vcxsrv/releases/download/${VCXSRV_VERSION}/vcxsrv.zip"
          unzip -o /tmp/vcxsrv.zip -d "$VCXSRV_DIR" > /dev/null
          echo "VcXsrv files:" && ls -la "$VCXSRV_DIR"

      - name: Package (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files (x86)\NSIS\Bin;$env:Path"
          $VERSION = "${{ env.VERSION }}"
          $ROOT = $env:GITHUB_WORKSPACE
          $AMD64_BIN = Join-Path $ROOT 'build\bin\uniTerm-amd64.exe'
          $ARM64_BIN = Join-Path $ROOT 'build\bin\uniTerm-arm64.exe'
          $NSI = Join-Path $ROOT 'build\windows\installer\project.nsi'

          # compress amd64 with upx; arm64 is left uncompressed because
          # UPX 5.2.0 can't pack the PE section structure that Wails'
          # new Go WebView2Loader produces for windows/arm64
          upx --best --lzma $AMD64_BIN

          $VCXSRV_DIR = Join-Path $ROOT 'build\windows\installer\plugins\vcxsrv'

          # rebuild NSIS installers (one per arch) so the amd64 installer
          # embeds the compressed binary; arm64 installer is regenerated
          # too but with the original uncompressed binary. Use absolute
          # paths (mirroring how Wails internally invokes makensis) since
          # NSIS' `File` command is unreliable with `..` relative paths
          # on Windows.
          & makensis "-DVERSION=$VERSION" "-DARG_WAILS_AMD64_BINARY=$AMD64_BIN" "-DVCXSRV_DIR=$VCXSRV_DIR" $NSI
          & makensis "-DVERSION=$VERSION" "-DARG_WAILS_ARM64_BINARY=$ARM64_BIN" "-DVCXSRV_DIR=$VCXSRV_DIR" $NSI

          foreach ($arch in @('amd64', 'arm64')) {
            $srcExe = Join-Path $ROOT "build\bin\uniTerm-$arch.exe"
            $srcInstaller = Join-Path $ROOT "build\bin\uniTerm-$arch-installer.exe"

            # portable zip
            New-Item -ItemType Directory -Force -Path dist_tmp | Out-Null
            Copy-Item $srcExe "dist_tmp\uniTerm.exe"
            Copy-Item -Recurse $VCXSRV_DIR "dist_tmp\plugins\vcxsrv"
            Compress-Archive -Path dist_tmp\* -DestinationPath "uniterm-windows-$arch-portable-$VERSION.zip" -Force
            Remove-Item -Recurse -Force dist_tmp

            # rename NSIS installer
            Move-Item $srcInstaller "uniterm-windows-$arch-installer-$VERSION.exe"
          }

      - name: Package (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          ARCH=${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          NFPM_ARCH=${{ matrix.platform == 'linux/amd64' && 'x86_64' || 'arm64' }}

          cd build/bin
          chmod +x uniTerm

          # tar.gz
          tar czf ../../uniterm-linux-${ARCH}-${VERSION}.tar.gz uniTerm

          # nfpm for deb + rpm
          cd ../..
          NFPM_VER="2.46.3"
          curl -sSfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_${NFPM_ARCH}.tar.gz"
          tar xf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm
          nfpm --version

          cat > nfpm.yaml << EOF
          name: uniterm
          arch: ${ARCH}
          platform: linux
          version: ${VERSION}
          maintainer: uniTerm <uniTerm@example.com>
          description: Lightweight all-in-one terminal emulator with built-in AI Agent
          homepage: https://uniterm.net
          license: Proprietary
          depends:
            - libgtk-3-0
            - libwebkit2gtk-4.1-0
          overrides:
            rpm:
              depends:
                - gtk3
                - webkit2gtk4.1
          contents:
            - src: build/bin/uniTerm
              dst: /usr/bin/uniterm
            - src: build/linux/uniterm.desktop
              dst: /usr/share/applications/uniterm.desktop
            - src: build/appicon.png
              dst: /usr/share/icons/hicolor/128x128/apps/uniterm.png
          EOF

          nfpm package --config nfpm.yaml --packager deb \
            --target "uniterm-linux-${ARCH}-${VERSION}.deb"
          nfpm package --config nfpm.yaml --packager rpm \
            --target "uniterm-linux-${ARCH}-${VERSION}.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uniTerm-${{ matrix.slug }}
          path: |
            uniterm-*.zip
            uniterm-*.tar.gz
            uniterm-*.exe
            uniterm-*.dmg
            uniterm-*.deb
            uniterm-*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.preview == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec mv {} . \;
          ls -la uniterm-*

      - name: Determine release mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Extract changelog
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            SHA="${{ github.sha }}"
            SHORT=$(echo "$SHA" | cut -c1-7)
            NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            cat > release_body.md <<EOF
          ## ⚠️ Preview Release / 预览版本

          This is a **preview/prerelease** build, **not an official release**. Do not distribute.
          本次为**预览构建，非正式发布版本**，请勿对外分发。

          - Commit: \`${SHORT}\`
          - Branch: \`${{ github.ref_name }}\`
          - Built: ${NOW}
          - Run: ${RUN_URL}
          EOF
          else
            sed -n "/^## ${{ github.ref_name }}$/,/^## v/p" CHANGELOG.md | sed '$d' > release_body.md
          fi

      - name: Detect prerelease
        if: github.event_name != 'workflow_dispatch'
        run: |
          if echo "${{ github.ref_name }}" | grep -qiE '\-(rc|beta|alpha|pre|dev)'; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'main-snapshot' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Main Snapshot' || github.ref_name }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body_path: release_body.md
          files: |
            uniterm-*.zip
            uniterm-*.tar.gz
            uniterm-*.exe
            uniterm-*.dmg
            uniterm-*.deb
            uniterm-*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
