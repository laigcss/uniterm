# 鸿蒙适配 CI/CD 构建流水线
# 路径D：Go 静态编译为子进程（CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 + -tags server,production）
# 产出 ELF ARM64 静态链接二进制，鸿蒙 ArkWeb 前端连 localhost:9245
name: Build HarmonyOS

on:
  push:
    branches:
      - feature/harmonyos-path-d
      - main
    paths:
      - 'harmonyos/**'
      - 'scripts/build-harmonyos.sh'
      - 'main.go'
      - 'server_config*.go'
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则使用分支名或 dev）'
        required: false
        default: ''
      skip_frontend:
        description: '跳过前端构建'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 构建鸿蒙 ARM64 二进制
  # ===========================================================================
  build-harmonyos:
    name: 构建鸿蒙 ARM64 二进制
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 设置 Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: 设置 Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 缓存 Go 模块
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-

      - name: 缓存 npm 模块
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-20-

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 构建前端
        if: ${{ github.event.inputs.skip_frontend != 'true' }}
        run: |
          cd frontend
          npm run build

      - name: Go 交叉编译
        run: |
          echo "==> 开始 Go 交叉编译 (linux/arm64, 静态链接)"
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build \
            -tags server,production \
            -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o uniterm-harmonyos \
            .
          echo "==> 编译完成"

      - name: 验证产出
        run: |
          echo "==> 验证构建产物"
          file uniterm-harmonyos
          # 验证 ELF 格式
          file uniterm-harmonyos | grep -qi "ELF" \
            || { echo "ERROR: 产出不是 ELF 格式"; exit 1; }
          # 验证 ARM64/aarch64 架构
          file uniterm-harmonyos | grep -qiE "aarch64|ARM64" \
            || { echo "ERROR: 产出不是 ARM64 架构"; exit 1; }
          # 验证静态链接
          file uniterm-harmonyos | grep -qi "statically linked" \
            || { echo "ERROR: 产出不是静态链接"; exit 1; }
          echo "✓ 验证通过: ELF ARM64 静态链接二进制"
          # 输出文件大小和 SHA256
          echo "文件大小: $(du -h uniterm-harmonyos | cut -f1)"
          echo "SHA256:   $(sha256sum uniterm-harmonyos | cut -d' ' -f1)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: uniterm-harmonyos-linux-arm64
          path: uniterm-harmonyos
          retention-days: 30

      # 可选：tag push 时创建 Release 并上传产物
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uniterm-harmonyos
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # ===========================================================================
  # 运行测试（与构建并行）
  # ===========================================================================
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 设置 Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: 设置 Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 缓存 Go 模块
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.27-

      - name: 缓存 npm 模块
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-20-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-20-

      - name: 运行 Go 测试
        run: |
          echo "==> 运行 backend Go 测试"
          go test -v ./backend/...

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 运行前端测试
        run: |
          cd frontend
          # 检查是否存在测试文件，存在则运行 vitest
          if find . -path ./node_modules -prune -o \
             \( -name "*.test.ts" -o -name "*.spec.ts" \
                -o -name "*.test.tsx" -o -name "*.spec.tsx" \) -print 2>/dev/null | grep -q .; then
            echo "==> 发现前端测试文件，运行 vitest"
            npx vitest run
          else
            echo "==> 未发现前端测试文件，跳过前端测试"
          fi
